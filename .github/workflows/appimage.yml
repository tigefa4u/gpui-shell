name: Build Linux AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils build-essential pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-xcb-dev libvulkan1 \
            mesa-vulkan-drivers fonts-dejavu-core fonts-dejavu-mono xvfb xauth xdotool
      - name: Build release binary
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --locked --release
      - name: Package AppImage
        run: bash packaging/appimage/build.sh target/release/gpui-shell dist/GPUI-Shell-x86_64.AppImage
      - name: Smoke-test the AppImage without FUSE
        run: xvfb-run -a bash packaging/appimage/smoke.sh dist/GPUI-Shell-x86_64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GPUI-Shell-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0
